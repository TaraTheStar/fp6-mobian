# fp6-mobian-support: no system suspend on the Fairphone (Gen. 6) yet.
# - UFS resume on milos has been reported to lose the root filesystem, and
#   no fix for it is proven yet.
# - WiFi and BT share the WCN6755: idle suspend resets its firmware and WiFi
#   stays gone for a long time afterwards.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
