# Acoustic echo cancellation for VoLTE calls (based on Catcrafts fp6-img's
# 50-echo-cancel.conf).
# Creates a virtual pair: ec_sink (play here; forwarded to the speakers and
# used as the AEC reference) and ec_source (mic with the speaker signal
# subtracted, WebRTC AEC). They are NOT the defaults: imsd routes only the call
# audio through them (IMSD_PLAY_TARGET/IMSD_REC_TARGET, see
# /usr/lib/systemd/system/imsd.service.d/fp6-audio.conf), so music is untouched.
# capture/playback are pinned to the hardware nodes of our UCM (HiFi verb), so
# even with ec_* as defaults the module cannot loop into itself.
# No node.dont-fallback: at boot PipeWire loads this before WirePlumber has
# created the ALSA nodes; with dont-fallback the streams fail ("defined target
# not found") and the module unloads itself.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            source.props = {
                node.name = "ec_source"
                node.description = "Echo-cancelled microphone (calls)"
            }
            sink.props = {
                node.name = "ec_sink"
                node.description = "Echo-cancelled speakers (calls)"
            }
            capture.props = {
                node.name = "ec_capture"
                target.object = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive = true
            }
            playback.props = {
                node.name = "ec_playback"
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.passive = true
            }
        }
    }
]
