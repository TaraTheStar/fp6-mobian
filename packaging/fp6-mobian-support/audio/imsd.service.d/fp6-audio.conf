# fp6-mobian-support: call audio for imsd on the Fairphone (Gen. 6). Needs imsd
# with IMSD_*_TARGET / IMSD_*_CHANNEL support (Debian imsd patch 0003); imsd
# without it ignores these and uses the default devices.
#  - through the echo canceller (50-fp6-echo-cancel.conf), not the defaults
#  - played on FL only = the top speaker (Amplifier L, the earpiece); the
#    bottom speaker stays silent during calls, music still uses both
#  - the mic taken from FL only (FR of the capture is empty; a mono downmix
#    halved the level), and GAIN=1.5 instead of imsd's default of 10
#    (+20 dB), which amplified the speaker echo the far end heard
# Override in /etc/imsd.env (EnvironmentFile= wins over Environment=).
[Service]
Environment=IMSD_PLAY_TARGET=ec_sink IMSD_REC_TARGET=ec_source
Environment=IMSD_PLAY_CHANNEL=FL IMSD_REC_CHANNEL=FL
Environment=GAIN=1.5
